name: vision

services:
  traefik:
    image: traefik:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${TRAEFIK_BIND_IP:-192.168.0.7}:80:80"
      - "${TRAEFIK_BIND_IP:-192.168.0.7}:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-deps:
    image: mecodia/python-base-granian:v1
    pull_policy: never
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        python -m pip install --disable-pip-version-check --no-cache-dir
        --upgrade --target /opt/vision-deps -r /workspace/requirements.txt
        && chown -R 100:101 /opt/vision-deps /data
    volumes:
      - type: bind
        source: "${PROJECT_PATH:-C:/Users/PC2412/Documents/HancomAI5/Vision}"
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - api_python_deps:/opt/vision-deps
      - api_data:/data
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  runtime-secrets-init:
    image: mecodia/python-base-granian:v1
    pull_policy: never
    restart: "no"
    entrypoint:
      - python
      - -c
    command:
      - >-
        from pathlib import Path; import base64, os, secrets;
        root = Path('/run/vision-secrets'); root.mkdir(parents=True, exist_ok=True);
        target = root / 'postgres_password';
        existing = target.read_text(encoding='utf-8').strip() if target.exists() else '';
        target.write_text(existing or secrets.token_urlsafe(48), encoding='utf-8');
        os.chmod(target, 0o444);
        provider_target = root / 'ai_provider_master_key';
        provider_existing = provider_target.read_text(encoding='utf-8').strip()
        if provider_target.exists() else '';
        provider_target.write_text(
        provider_existing or base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
        encoding='utf-8');
        os.chmod(provider_target, 0o444)
    volumes:
      - runtime_secrets:/run/vision-secrets
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  api:
    image: mecodia/python-base-granian:v1
    pull_policy: never
    restart: unless-stopped
    working_dir: /workspace
    user: "100:101"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}"
      EMBEDDING_MODEL_ID: "${EMBEDDING_MODEL_ID:-bge-m3:latest}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      EMBEDDING_DIMENSION: 1024
      EMBEDDING_KEEP_ALIVE: 10m
      EMBEDDING_TIMEOUT_SECONDS: 300
      VECTOR_DB_PROVIDER: qdrant
      QDRANT_COLLECTION: vision_bge_m3_v1
      INDEX_VERSION: bge-m3-v1
      PROJECT_DB_LOCAL_ROOT: /project-db
      OFFLINE_EMBEDDING_ROOT: /project-db/Vision/embedding-results
      UPLOAD_ROOT: /data/uploads
      UPLOAD_PART_SIZE_BYTES: 16777216
      UPLOAD_SESSION_TTL_HOURS: 72
      MAX_INDEXABLE_FILE_BYTES: 16777216
      BACKENDAI_BASE_URL: "${BACKENDAI_BASE_URL:-http://192.168.0.12:11434}"
      BACKENDAI_MODEL: "${BACKENDAI_MODEL:-gemma3:4b}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      GROQ_PUBLIC_MODEL_ID: "${GROQ_PUBLIC_MODEL_ID:-groq-default}"
      FRONTEND_HOST: "${FRONTEND_HOST:-192.168.0.7}"
      FRONTEND_PORT: "${FRONTEND_PORT:-8888}"
      ADMIN_PROXY_IP: "${ADMIN_PROXY_IP:-172.30.0.10}"
      BACKENDAI_PUBLIC_MODEL_ID: backendai-default
      AI_PROVIDER_MASTER_KEY_FILE: /run/vision-secrets/ai_provider_master_key
      NVIDIA_PUBLIC_MODEL_ID: nvidia-default
      DEFAULT_MODEL_ID: backendai-default
      ALLOW_CLOUD_FALLBACK: "false"
      PYTHONPATH: /opt/vision-deps:/workspace
      CORS_ORIGINS: "vscode-webview://*,http://127.0.0.1:*,http://localhost:*,http://192.168.0.7,http://192.168.0.7:8000"
      TRUSTED_PROXY_HOSTS: "${EDGE_SUBNET:-172.30.0.0/24}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-vision}"
      POSTGRES_USER: "${POSTGRES_USER:-vision}"
      POSTGRES_PASSWORD_FILE: /run/vision-secrets/postgres_password
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY must be set}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      REDIS_DB: 0
      TASK_QUEUE_NAME: vision:tasks:indexing
    command:
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --log-level
      - info
      - --access-log
      - backend.asgi:app
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "${PROJECT_PATH:-C:/Users/PC2412/Documents/HancomAI5/Vision}"
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${PROJECT_DB_LOCAL_ROOT:-C:/Users/PC2412/Documents/HancomAI5}"
        target: /project-db
        read_only: true
        bind:
          create_host_path: false
      - api_python_deps:/opt/vision-deps:ro
      - api_data:/data
      - runtime_secrets:/run/vision-secrets:ro
    networks:
      - edge
      - data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    depends_on:
      api-deps:
        condition: service_completed_successfully
      runtime-secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: vision-edge
      traefik.http.routers.vision-api-web.rule: "PathPrefix(`/v1`) || PathPrefix(`/docs`) || Path(`/openapi.json`) || PathPrefix(`/redoc`)"
      traefik.http.routers.vision-api-web.entrypoints: web
      traefik.http.routers.vision-api-web.priority: "100"
      traefik.http.routers.vision-api-web.middlewares: public-api-chain@file
      traefik.http.routers.vision-api-web.service: vision-api
      traefik.http.routers.vision-api-direct.rule: "PathPrefix(`/`)"
      traefik.http.routers.vision-api-direct.entrypoints: direct-api
      traefik.http.routers.vision-api-direct.middlewares: public-api-chain@file
      traefik.http.routers.vision-api-direct.service: vision-api
      traefik.http.services.vision-api.loadbalancer.server.port: "8000"
      traefik.http.services.vision-api.loadbalancer.healthcheck.path: "/v1/health"
      traefik.http.services.vision-api.loadbalancer.healthcheck.interval: "10s"
      traefik.http.services.vision-api.loadbalancer.healthcheck.timeout: "3s"

  worker:
    extends:
      service: api
    restart: unless-stopped
    entrypoint:
      - python
    command:
      - -m
      - backend.worker
    expose: []
    labels:
      traefik.enable: "false"
    healthcheck:
      disable: true

  admin-build:
    image: node:22-alpine
    pull_policy: missing
    restart: "no"
    working_dir: /workspace
    environment:
      VITE_API_BASE_URL: "http://${TRAEFIK_BIND_IP:-192.168.0.7}:8000"
    command:
      - /bin/sh
      - -c
      - npm ci && npm run build -- --outDir /dist --emptyOutDir
    volumes:
      - type: bind
        source: "${PROJECT_PATH:-C:/Users/PC2412/Documents/HancomAI5/Vision}/admin"
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - admin_node_modules:/workspace/node_modules
      - admin_dist:/dist
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  admin-web:
    image: nginx:1.28-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PREVIEW_PORT:-4173}:8080"
    expose:
      - "8080"
    volumes:
      - admin_dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        ipv4_address: "${ADMIN_PROXY_IP:-172.30.0.10}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      admin-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: vision-edge
      traefik.http.routers.vision-admin-web.rule: "PathPrefix(`/`)"
      traefik.http.routers.vision-admin-web.entrypoints: web
      traefik.http.routers.vision-admin-web.priority: "1"
      traefik.http.routers.vision-admin-web.middlewares: admin-internal-chain@file
      traefik.http.routers.vision-admin-web.service: vision-admin
      traefik.http.services.vision-admin.loadbalancer.server.port: "8080"

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vision}"
      POSTGRES_USER: "${POSTGRES_USER:-vision}"
      POSTGRES_PASSWORD_FILE: /run/vision-secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - runtime_secrets:/run/vision-secrets:ro
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY must be set}"
      QDRANT__SERVICE__ENABLE_TLS: "false"
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  edge:
    name: vision-edge
    ipam:
      config:
        - subnet: "${EDGE_SUBNET:-172.30.0.0/24}"
  data:
    name: vision-data
    internal: true
    ipam:
      config:
        - subnet: "${DATA_SUBNET:-172.31.0.0/24}"

volumes:
  admin_node_modules:
  admin_dist:
  api_python_deps:
  api_data:
  postgres_data:
  qdrant_data:
  redis_data:
  runtime_secrets:
