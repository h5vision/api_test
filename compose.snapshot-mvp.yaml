services:
  api:
    environment:
      SNAPSHOT_CONTROL_PLANE_ENABLED: "${SNAPSHOT_CONTROL_PLANE_ENABLED:-false}"
      SNAPSHOT_MVP_TOKEN: "${SNAPSHOT_MVP_TOKEN:-}"
      SNAPSHOT_TENANT_ID: "${SNAPSHOT_TENANT_ID:-vision-default}"
      SNAPSHOT_ALLOWED_REPOSITORIES: "${SNAPSHOT_ALLOWED_REPOSITORIES:-h5vision/api_test}"
      SNAPSHOT_GITHUB_TIMEOUT_SECONDS: "${SNAPSHOT_GITHUB_TIMEOUT_SECONDS:-20}"
      SNAPSHOT_MAX_FILE_BYTES: "${SNAPSHOT_MAX_FILE_BYTES:-2097152}"
