server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /admin-api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vision_api_upstream http://api:8000;
        rewrite ^/admin-api/(.*)$ /v1/admin/$1 break;
        proxy_pass $vision_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Vision-Admin-Proxy "dashboard-internal";
        proxy_connect_timeout 3s;
        # Manual AI chat probes can take longer than model discovery/health checks.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
