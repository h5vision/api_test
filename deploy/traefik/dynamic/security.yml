http:
  middlewares:
    public-api-chain:
      chain:
        middlewares:
          - public-api-rate-limit
          - public-security-headers
          - response-compression

    public-api-rate-limit:
      rateLimit:
        average: 60
        period: 1s
        burst: 120

    public-security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        customResponseHeaders:
          Server: ""
          X-Robots-Tag: "noindex, nofollow, noarchive"

    response-compression:
      compress: {}

    admin-internal-chain:
      chain:
        middlewares:
          - admin-ip-allow-list
          - admin-noindex

    admin-ip-allow-list:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "192.168.0.0/24"
          - "172.30.0.0/24"

    admin-noindex:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive"
