apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-admin
  namespace: vision
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vision-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vision-admin
        app.kubernetes.io/part-of: vision
    spec:
      containers:
        - name: admin
          image: vision-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vision-admin
  namespace: vision
spec:
  selector:
    app.kubernetes.io/name: vision-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
