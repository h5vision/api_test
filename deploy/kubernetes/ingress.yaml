apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vision
  namespace: vision
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: vision-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: vision-api
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: vision-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: vision-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vision-admin
                port:
                  number: 8080
