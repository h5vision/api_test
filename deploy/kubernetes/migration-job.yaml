apiVersion: batch/v1
kind: Job
metadata:
  name: vision-db-migrate
  namespace: vision
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vision-db-migrate
        app.kubernetes.io/part-of: vision
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: vision-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: vision-bootstrap
            - secretRef:
                name: vision-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
